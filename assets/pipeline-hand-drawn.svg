    <path d="M558,490 Q460,490 362,490 M362,490 l13,-6 M362,490 l13,6" stroke="#1d2126" stroke-width="2.8"/>
    <rect x="60" y="280" width="300" height="100" rx="10" fill="#e6f4ea" stroke="none"/>
    <path d="M62,281 Q210,278 358,282 Q362,330 358,378 Q210,382 62,378 Q58,330 61,282 Z" stroke="#217a44" stroke-width="2.8"/>
    <rect x="60" y="440" width="300" height="100" rx="10" fill="#e6f4ea" stroke="none"/>
    <path d="M62,441 Q210,438 358,442 Q362,490 358,538 Q210,542 62,538 Q58,490 61,442 Z" stroke="#217a44" stroke-width="2.8"/>
  </g>
  <g font-family="Caveat, 'Segoe Print', 'Bradley Hand', cursive" font-weight="600" font-size="26" fill="#1d2126" text-anchor="middle">
    <text x="1075" y="347"><tspan x="1075" dy="0">proyecto</tspan><tspan x="1075" dy="29">listo</tspan></text>
    <text x="705" y="272" font-size="24">synapseForge run</text>
    <text x="705" y="382" font-size="24">synapseForge launch</text>
    <text x="705" y="492" font-size="24">docker compose up</text>
    <text x="210" y="322"><tspan x="210" dy="0">app de escritorio</tspan><tspan x="210" dy="29">/ zip portable</tspan></text>
    <text x="210" y="482"><tspan x="210" dy="0">contenedor</tspan><tspan x="210" dy="29">Docker</tspan></text>
  </g>
  <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="13" fill="#5f666e" text-anchor="middle">
    <text x="705" y="298">servidores de desarrollo</text>
    <text x="705" y="408">app de escritorio / zip</text>
    <text x="705" y="518">contenedor</text>
  </g>

  <text x="40" y="660" font-family="Caveat, 'Segoe Print', 'Bradley Hand', cursive" font-weight="600" font-size="32" fill="#a8610b">Un proyecto, tres salidas: desarrollo, escritorio o Docker.</text>
</svg>
