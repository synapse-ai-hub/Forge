    <rect x="620" y="110" width="280" height="120" rx="10" fill="#f0e9fa" stroke="none"/>
    <path d="M622,111 Q760,108 898,112 Q902,170 898,228 Q760,232 622,228 Q618,170 621,112 Z" stroke="#6c41ad" stroke-width="2.8"/>
    <path d="M902,170 Q926,170 948,170 M948,170 l-13,-6 M948,170 l-13,6" stroke="#1d2126" stroke-width="2.8"/>
    <rect x="950" y="110" width="250" height="120" rx="10" fill="#f0e9fa" stroke="none"/>
    <path d="M952,111 Q1075,108 1198,112 Q1202,170 1198,228 Q1075,232 952,228 Q948,170 951,112 Z" stroke="#6c41ad" stroke-width="2.8"/>
    <path d="M1075,232 Q1076,265 1075,298 M1075,298 l-6,-13 M1075,298 l6,-13" stroke="#1d2126" stroke-width="2.8"/>
  </g>
  <g font-family="Caveat, 'Segoe Print', 'Bradley Hand', cursive" font-weight="600" font-size="26" fill="#1d2126" text-anchor="middle">
    <text x="165" y="162"><tspan x="165" dy="0">pip install</tspan><tspan x="165" dy="29">synapseForge</tspan></text>
    <text x="455" y="162"><tspan x="455" dy="0">synapseForge</tspan><tspan x="455" dy="29">init</tspan></text>
    <text x="760" y="162"><tspan x="760" dy="0">GUI: nombre,</tspan><tspan x="760" dy="29">logo, colores</tspan></text>
    <text x="1075" y="162"><tspan x="1075" dy="0">template +</tspan><tspan x="1075" dy="29">venv + deps</tspan></text>
  </g>
  <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="13" fill="#5f666e" text-anchor="middle">
    <text x="165" y="216">PyPI</text>
    <text x="455" y="216">CLI interactiva</text>
    <text x="1075" y="216">se genera solo</text>
  </g>

  <!-- fila 2 (serpentina: proyecto listo -> 3 caminos -> artefactos) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="950" y="300" width="250" height="110" rx="10" fill="#e6f4ea" stroke="none"/>
