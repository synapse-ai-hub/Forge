<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Diagrama dibujado a mano del pipeline de synapseForge: pip install, init, GUI, template, proyecto listo, tres caminos (run, launch, docker) y artefactos distribuibles.">
  <rect x="0" y="0" width="1280" height="720" fill="#fbfaf6"/>
  <text x="40" y="34" font-family="'IBM Plex Mono', Consolas, monospace" font-size="14" fill="#5f666e">DE CERO A APP</text>
  <text x="40" y="82" font-family="Caveat, 'Segoe Print', 'Bradley Hand', cursive" font-weight="600" font-size="46" fill="#1d2126">De pip install a app distribuible</text>

  <!-- fila 1 -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="40" y="110" width="250" height="120" rx="10" fill="#e8effc" stroke="none"/>
    <path d="M42,111 Q165,108 288,112 Q292,170 288,228 Q165,232 42,228 Q38,170 41,112 Z" stroke="#2257c8" stroke-width="2.8"/>
