name: '🔎 Gemini Review - Frontend'

on:
  pull_request:
    branches: [main]
    paths: ['frontend/**']
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@gemini-cli /review'))
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Get PR refs'
        id: pr
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(basename "${{ github.event.issue.pull_request.url }}")
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/$PR_NUM)
          echo "base=$(echo "$PR_JSON" | jq -r '.base.ref')" >> $GITHUB_OUTPUT
          echo "head=$(echo "$PR_JSON" | jq -r '.head.ref')" >> $GITHUB_OUTPUT

      - name: 'Check if PR touches frontend files'
        id: filter
        if: github.event_name == 'issue_comment'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.pr.outputs.base }}
          ref: ${{ steps.pr.outputs.head }}
          filters: |
            frontend:
              - 'frontend/**'

      - uses: 'google-github-actions/run-gemini-cli@v0'
        if: |-
          (github.event_name == 'pull_request') ||
          (github.event_name == 'issue_comment' && steps.filter.outputs.frontend == 'true')
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GEMINI_API_KEY: '${{ secrets.GOOGLE_API_KEY }}'
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          gemini_model: 'gemini-3.5-flash-lite'
          prompt: |
            Eres un revisor de código experto para el frontend de synapseForge (React 18 + Vite + TS + Tailwind).
            Revisa los cambios del Pull Request actual.

            **Instrucción crítica**: Debes publicar tu revisión como un comentario en el PR.
            Sigue estos pasos exactamente usando tus herramientas:
            1. Usa la herramienta `write_file` para escribir tu revisión completa en el archivo `/tmp/review.md`.
            2. Usa la herramienta `run_shell_command` para ejecutar exactamente este comando:
               `gh pr comment ${{ github.event.pull_request.number || github.event.issue.number }} --body-file /tmp/review.md`

            Asegúrate de que el archivo `/tmp/review.md` esté formateado correctamente. Si no hay problemas, el archivo debe contener exactamente "No issues found. Code looks clean and ready to merge.".

            <CONTEXT>
                **Repository**: synapseForge - Frontend Service (React 18 + Vite + TS + Tailwind)
                **Focus**: React components, hooks, TypeScript types, UI styling, accessibility, performance.
            </CONTEXT>
            <OUTPUT>
            The output **MUST** be clean, concise, and structured exactly as follows.

            **If no issues are found:**
            # Change summary: [Single sentence description of the overall change].
            No issues found. Code looks clean and ready to merge.

            **If issues are found:**
            # Change summary: [Single sentence description of the overall change].
            [Optional general feedback for the entire change.]

            ## File: path/to/file/one
            ### L<LINE_NUMBER>: [<SEVERITY>] Single sentence summary of the issue.
            More details about the issue.
            Suggested change: show the diff inline, using lines that start with "- " for the old code and "+ " for the new code. Do not wrap this in triple backticks.
            </OUTPUT>