name: '🔎 Gemini Review - Backend'

on:
  pull_request:
    branches: [main]
    paths: ['backend/**']
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |-
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '@gemini-cli /review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      # En issue_comment el checkout por defecto trae main, no el PR.
      # fetch-depth: 0 permite comparar contra main con git diff / git log.
      - uses: 'actions/checkout@v4'
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          fetch-depth: 0

      - name: 'Record start time'
        id: start
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 'Get PR refs'
        id: pr
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(basename "${{ github.event.issue.pull_request.url }}")
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/$PR_NUM)
          echo "base=$(echo "$PR_JSON" | jq -r '.base.ref')" >> $GITHUB_OUTPUT
          echo "head=$(echo "$PR_JSON" | jq -r '.head.ref')" >> $GITHUB_OUTPUT

      - name: 'Check if PR touches backend files'
        id: filter
        if: github.event_name == 'issue_comment'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.pr.outputs.base }}
          ref: ${{ steps.pr.outputs.head }}
          filters: |
            backend:
              - 'backend/**'

      - name: 'Generar diff del PR'
        id: diff
        if: github.event_name != 'issue_comment' || steps.filter.outputs.backend == 'true'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
        run: |
          gh pr diff "${PR_NUMBER}" --repo "${{ github.repository }}" > pr_full.diff
          awk -v prefix="backend/" '
            /^diff --git / {
              keep = (index($0, " b/" prefix) > 0 || index($0, " \"b/" prefix) > 0) ? 1 : 0
            }
            keep { print }
          ' pr_full.diff > pr.diff
          echo "Diff filtrado a backend/: $(wc -l < pr.diff) lineas (de $(wc -l < pr_full.diff) totales)"
          if [[ -s pr.diff ]]; then
            echo "empty=false" >> "${GITHUB_OUTPUT}"
          else
            echo "empty=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: 'google-github-actions/run-gemini-cli@v0'
        id: gemini
        if: |-
          (github.event_name == 'pull_request') ||
          (github.event_name == 'issue_comment' && steps.filter.outputs.backend == 'true')
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GEMINI_API_KEY: '${{ secrets.GOOGLE_API_KEY }}'
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          gemini_model: 'gemini-3.5-flash-lite'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || false) }}'
          github_pr_number: '${{ github.event.pull_request.number || github.event.issue.number }}'
          settings: |-
            {
              "context": {
                "includeDirectories": ["/tmp"]
              },
              "tools": {
                "allowed": [
                  "write_file",
                  "run_shell_command(gh pr comment)",
                  "run_shell_command(gh pr diff)",
                  "run_shell_command(gh pr view)",
                  "run_shell_command(git diff)",
                  "run_shell_command(git log)",
                  "run_shell_command(git show)",
                  "run_shell_command(git diff-tree)",
                  "run_shell_command(git status)",
                  "run_shell_command(git branch)"
                ]
              }
            }
          prompt: '/review-backend'

      - name: 'Fallback - post review if Gemini did not'
        if: ${{ always() && steps.gemini.conclusion != 'skipped' && steps.gemini.conclusion != 'cancelled' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          START_TS: ${{ steps.start.outputs.ts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          POSTED=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .created_at >= \"$START_TS\") | .id" | wc -l)
          if [ "$POSTED" -gt 0 ]; then
            echo "Gemini ya comentó en el PR. Nada que hacer."
            exit 0
          fi

          REVIEW_FILE=""
          for f in /tmp/review.md "$GITHUB_WORKSPACE/review.md" "$HOME"/.gemini/tmp/*/review.md; do
            if [ -s "$f" ]; then REVIEW_FILE="$f"; break; fi
          done

          if [ -n "$REVIEW_FILE" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$REVIEW_FILE"
            echo "Comentario publicado por el fallback desde $REVIEW_FILE."
          else
            printf 'La revisión automática no generó un reporte. Ver el log: %s\n' "$RUN_URL" > "$RUNNER_TEMP/review.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/review.md"
            echo "::warning::No se encontró archivo de revisión. Activá GEMINI_DEBUG=true y revisá los logs."
          fi