scenario: scheduler-list-and-missing-task
description: >
  Agenda: el listado responde y editar el horario de una tarea que no existe se
  rechaza con error sin romper el servidor. Las tareas se crean con el creador de
  workflows (un LLM), por eso no se crean desde este escenario.
cleanup: false
steps:
  - action: request
    method: GET
    path: /api/scheduler/tasks
    expect:
      http_status: 200
      json_status: success
      json_path_exists:
        - tasks

  - action: request
    method: PUT
    path: /api/scheduler/tasks/e2e-id-inexistente-xyz
    body:
      enabled: false
    expect:
      http_status: 400
---
scenario: scheduler-delete-nonexistent
description: >
  Validación de error: borrar una tarea inexistente responde 404 sin romper
  el servidor.
cleanup: false
steps:
  - action: request
    method: DELETE
    path: /api/scheduler/tasks/e2e-id-inexistente-xyz
    expect:
      http_status: 404
