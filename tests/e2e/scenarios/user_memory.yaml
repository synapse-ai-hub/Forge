scenario: user-memory-add-list-delete
description: >
  Ciclo completo de preferencias del usuario: alta, listado (con el id
  creado) y borrado. Requiere API key de Google (embeddings de Gemini).
cleanup: true
steps:
  - action: request
    method: POST
    path: /api/user-memory
    body:
      text: E2E prefiere respuestas cortas
    expect:
      http_status: 200
      json_status: success
      json_path_exists:
        - data.id
        - data.text
    save:
      pref_id: data.id

  - action: request
    method: GET
    path: /api/user-memory
    expect:
      http_status: 200
      json_status: success
      json_path_exists:
        - data.preferences

  - action: request
    method: DELETE
    path: /api/user-memory/{pref_id}
    expect:
      http_status: 200
      json_status: success

  - action: request
    method: GET
    path: /api/user-memory
    expect:
      http_status: 200
      json_status: success
      json_path_exists:
        - data.preferences
---
scenario: user-memory-rejects-empty-text
description: >
  Validación de error: texto vacío debe rechazarse con 422 de Pydantic
  (Field min_length=1).
cleanup: false
steps:
  - action: request
    method: POST
    path: /api/user-memory
    body:
      text: ""
    expect:
      http_status: 422
---
scenario: user-memory-delete-nonexistent
description: >
  Validación de error: borrar un id inexistente devuelve contrato de
  error (HTTP 200 + status "error").
cleanup: false
steps:
  - action: request
    method: DELETE
    path: /api/user-memory/pref_inexistente_e2e_123
    expect:
      http_status: 200
      json_status: error
