scenario: prueba65
mode: score
prompt: |
  Sos un lector que puntúa una respuesta según el texto dado, sin usar conocimiento externo. El texto y la respuesta son los siguientes.

  Texto: El mate es una infusión típica del Río de la Plata que se prepara con yerba mate y agua caliente entre 70 y 80 grados. Nunca se hierve el agua porque quema la yerba y la vuelve amarga. El mate se ceba en un recipiente que también se llama mate, tradicionalmente de calabaza o madera, y se bebe con bombilla. El cebador es quien prepara y sirve, y toma los primeros mates que son los más fuertes. Pasar el mate con la mano izquierda o decir gracias significa que ya no se quiere más. En Uruguay el consumo per cápita es el más alto del mundo con 10 kilos anuales por persona, seguido por Argentina con 6 kilos. La yerba se cultiva en Misiones, Corrientes y el sur de Brasil y Paraguay, y el estacionamiento de la yerba dura entre 9 y 24 meses según el tipo. El mate cocido es otra forma de consumirlo, con saquitos como el té, y el tereré es la versión fría típica de Paraguay.

  Ampliación del texto con historia, preparación y costumbres:

  Origen e historia: los guaraníes ya tomaban mate antes de la llegada de los españoles, con agua fría en un poro y una caña como bombilla. Los jesuitas lo cultivaron en las misiones del siglo 17 y lo llevaron a todo el virreinato. En el siglo 19 el mate era moneda de cambio en la campaña y los gauchos lo tomaban en el fogón antes del amanecer. La yerba mate (Ilex paraguariensis) es un árbol nativo de la cuenca del Paraná. La cosecha es entre abril y septiembre y la yerba se estaciona entre 9 y 24 meses según el tipo antes de envasarse. Argentina produce 300000 toneladas anuales y Uruguay tiene el consumo per cápita más alto del mundo con 10 kilos anuales por persona, seguido por Argentina con 6 kilos.

  Preparación en detalle: el agua debe estar entre 70 y 80 grados (si está fría lava la yerba, si hierve la quema y la vuelve amarga). Se calienta en pava sin silbato o se corta el hervor con agua fría. El mate se llena tres cuartas partes con yerba, se tapa con la mano y se agita para mezclar el polvo, se deja un hueco al costado para el agua y ahí se coloca la bombilla (una vez puesta no se mueve más). Los primeros mates son los más fuertes y los toma el cebador, que es quien prepara y sirve. Se ceba siempre en el mismo hueco para no lavar toda la yerba de golpe. Un mate bien cebado rinde 1 litro de agua con 50 gramos de yerba. La bombilla es de metal con filtro en la punta y hay que limpiarla con agua y bicarbonato cada 15 días porque se tapa con el polvo.

  Recipientes: el de calabaza (poro) es el tradicional y hay que curarlo con yerba usada 24 horas antes del primer uso. El de madera (algarrobo, quebracho) da sabor los primeros meses. El de metal o vidrio no da sabor y es más higiénico. Cada región tiene su preferencia: en el litoral se usa calabaza chica, en Buenos Aires el camionero grande, en el sur el de madera. El tamaño va de 100 a 300 mililitros.

  Costumbres de la ronda: el cebador sirve en orden y cada uno devuelve el mate al cebador. Pasar el mate con la mano izquierda o decir gracias significa que ya no se quiere más y el cebador pasa al siguiente. No se toca la bombilla ajena ni se la mueve. El mate se toma caliente y de un trago. En una reunión de trabajo el mate circula sin interrumpir la conversación. Ofrecer un mate es señal de confianza y rechazarlo sin motivo se considera descortés. En el campo se toma amargo (cimarrón) y en la ciudad el 60 por ciento lo toma con azúcar o edulcorante.

  Yerba y variedades: con palo (suave, 70 por ciento del mercado) o sin palo (fuerte, más polvo). Saborizadas con hierbas (15 por ciento del mercado). Orgánica y sin TACC (para celíacos, con sello). Barbacuá (secada a fuego directo, sabor ahumado, típica de Misiones). El polvo de la yerba tapa la bombilla y por eso se agita antes de cebar.

  Tereré, mate cocido y otras versiones: el tereré es la versión fría típica de Paraguay (donde es bebida nacional con día propio, el último sábado de febrero), se toma con agua fría y hierbas en guampa con bombilla ancha. El mate cocido se prepara con saquitos como el té y en los colegios se da con leche. El mate de leche reemplaza el agua por leche caliente. En Siria y Líbano (por los inmigrantes que volvieron) se toma mate amargo en vaso chico y es la bebida social principal.

  Cultivo y zonas: la yerba se cultiva en Misiones, Corrientes y el sur de Brasil y Paraguay. El INYM regula la producción y el estacionamiento mínimo es 9 meses por ley. La yerba de 24 meses es la más suave y la de 9 la más fuerte.

  Salud y datos: tiene cafeína (mateína, 70 mg por mate), antioxidantes y vitaminas B y C. No se recomienda más de 2 litros por día ni tomarlo a más de 65 grados de forma habitual.

  El mate en números: 9 de cada 10 hogares argentinos tienen yerba. El consumo per cápita de Uruguay (10 kilos) duplica al de Brasil (5 kilos en el sur). Paraguay consume 8 kilos por persona entre mate caliente y tereré. La producción mundial es 1.4 millones de toneladas (Brasil primero, Argentina segunda). El 80 por ciento de la yerba argentina se consume en el país y el 20 por ciento se exporta (Siria es el primer destino con 40000 toneladas anuales).

  Fiestas y cultura: la Fiesta Nacional de la Yerba Mate se hace en Apóstoles (Misiones) desde 1944. El Día Nacional del Mate es el 30 de noviembre (nacimiento de Andresito Guacurarí). Hay museos de la yerba en Misiones y Corrientes. El mate aparece en canciones, películas y publicidades como símbolo de amistad. Los argentinos que viven afuera pagan hasta 20 USD el kilo y hay grupos que comparten yerba por correo. En las oficinas el mate circula en reuniones y hay roles rotativos de cebador.

  Economía de la yerba: el precio en góndola se compone de 40 por ciento impuestos, 30 por ciento molino y 30 por ciento productor. El INYM fija el precio de la hoja verde 2 veces por año y los productores reclaman que no cubre costos. La sequía de 2022 bajó la cosecha 15 por ciento y el precio subió 60 por ciento en 1 año. Las cooperativas de Misiones venden yerba de 24 meses a precio premium (50 por ciento más). El contrabando desde Paraguay mueve 50000 toneladas anuales sin estacionar (yerba verde de 3 meses, más fuerte y barata). Los molinos grandes compran el 70 por ciento de la hoja y los chicos pelean por el resto. La yerba sin TACC y la orgánica crecen 20 por ciento anual desde 2020.

  El mate en el mundo: Siria es el primer destino de exportación (40000 toneladas anuales) por los inmigrantes que volvieron con la costumbre. En Líbano se toma en vaso chico y es la bebida social principal. En Uruguay el mate es más fuerte (sin palo, más polvo) y se toma con termo bajo el brazo en la calle. En el sur de Brasil se llama chimarrão y se toma en cuia grande. En Paraguay el tereré es bebida nacional con día propio. Hay comunidades materas en España, Italia, Alemania y Estados Unidos (argentinos y uruguayos afuera). El mate cocido en saquitos se vende en supermercados de 30 países. La yerba mate fría en botella (tereré industrial) crece en Paraguay y Brasil.

  Respuesta a puntuar: El agua para el mate debe estar entre 70 y 80 grados y nunca hervida, porque quema la yerba. Decir gracias significa que no querés más.

  Criterios: se valora exactitud respecto del texto, completitud de los datos relevantes y ausencia de invenciones.
