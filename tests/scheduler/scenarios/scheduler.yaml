scenario: scheduler-read-endpoints
description: >
  Verifica contra el backend real los endpoints de lectura de la agenda: tareas
  programadas (workflows con horario), ejecuciones iniciadas por el scheduler y
  catálogo de recursos. Las tareas se crean con el creador de workflows (un LLM),
  por eso este escenario no las crea.
cleanup: false
steps:
  - action: request
    method: GET
    path: /api/scheduler/tasks
    expect:
      http_status: 200
      json_status: success
      json_path_exists:
        - tasks
  - action: request
    method: GET
    path: /api/scheduler/runs
    expect:
      http_status: 200
      json_status: success
      json_path_exists:
        - runs
  - action: request
    method: GET
    path: /api/config/tools
    expect:
      http_status: 200
      json_status: success
      json_path_exists:
        - tools
