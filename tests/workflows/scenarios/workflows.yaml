scenario: workflow-run-inexistente
description: >
  Ejecutar (play) un workflow que no existe. Espera 404 con mensaje
  amigable. No requiere LLM.
cleanup: true
steps:
  - action: run
    workflow: no-existe-este-workflow
    expect:
      http_status: 404
      message_contains:
        - "no existe"
