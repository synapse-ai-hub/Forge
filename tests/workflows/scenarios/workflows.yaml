---
scenario: workflow-save-y-listado
description: >
  Guardar un workflow de prueba y verificar que aparece en el listado
  de workflows (GET /api/workflows). Sin LLM. No hay DELETE de
  workflows: el archivo e2e-test-workflow queda en disco y se
  sobrescribe en cada corrida.
cleanup: true
verify:
  workflow: e2e-test-workflow
steps:
  - action: request
    method: POST
    path: /api/config/workflows/save
    body:
      name: e2e-test-workflow
      yaml: |
        name: "e2e-test-workflow"
        description: "Workflow de prueba e2e"
        version: "1"
        retries: 1
        on_failure: continue
        nodes:
          - id: "leer"
            type: "tool"
            step: 1
            tool: "read"
          - id: "cerrar"
            type: "run"
            step: 2
            run: "echo listo"
            final: true
    expect:
      http_status: 200
      json_status: success
---
