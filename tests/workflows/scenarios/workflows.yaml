scenario: workflow-validate-ok
description: >
  Validar un workflow correcto (tool + agent + final) sin LLM.
  Espera 200 con status success.
cleanup: true
steps:
  - action: request
    method: POST
    path: /api/config/workflows/validate
    body:
      yaml: |
        name: "e2e-probe"
        description: "Sonda de validación"
        version: "1"
        retries: 2
        on_failure: continue
        nodes:
          - id: "leer"
            type: "tool"
            step: 1
            tool: "read"
          - id: "cerrar"
            type: "agent"
            step: 2
            agent_name: "router"
            final: true
    expect:
      http_status: 200
      json_status: success
---
scenario: workflow-validate-sin-final
description: >
  Validar un workflow sin nodo final. Espera 400 con mensaje de final.
  No requiere LLM.
cleanup: true
steps:
  - action: request
    method: POST
    path: /api/config/workflows/validate
    body:
      yaml: |
        name: "e2e-sin-final"
        description: "Sin final"
        nodes:
          - id: "leer"
            type: "tool"
            step: 1
            tool: "read"
    expect:
      http_status: 400
      json_status: error
---
scenario: workflow-validate-run-ok
description: >
  Validar un nodo run estilo github actions con workdir relativo.
  Espera 200. No requiere LLM.
cleanup: true
steps:
  - action: request
    method: POST
    path: /api/config/workflows/validate
    body:
      yaml: |
        name: "e2e-run-ok"
        description: "Run válido"
        nodes:
          - id: "eco"
            type: "run"
            step: 1
            run: "echo hola"
            timeout: 5000
            final: true
    expect:
      http_status: 200
      json_status: success
---
scenario: workflow-validate-run-workdir-traversal
